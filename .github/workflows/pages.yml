name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare
        env:
          EP: ${{ secrets.EP_URL }}
        run: |
          echo "[P01]"
          if [ -z "$EP" ]; then
            echo "[P90]"
            exit 1
          fi
          echo "[P02] n=${#EP}"
          mkdir -p dist
          sed "s|__EP__|${EP}|g" index.html > dist/index.html
          if grep -q "__EP__" dist/index.html; then
            echo "[P91]"
            exit 1
          fi
          echo "[P03]"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
