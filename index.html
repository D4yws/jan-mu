<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チェック</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #f5f6f8;
    color: #1d2330;
    transition: background-image 0.3s;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
  }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
  video { width: 100%; border-radius: 12px; background: #000; }
  button { font-size: 18px; padding: 16px; border: 0; border-radius: 12px; font-weight: 600; }
  #scanBtn { background: #dfe4ee; color: #1d2330; }
  #goBtn { background: #1f5eff; color: #fff; }
  input { font-size: 22px; padding: 14px; border: 2px solid #c5ccdb; border-radius: 12px; letter-spacing: 1px; width: 100%; }
  input:focus-visible, button:focus-visible { outline: 3px solid #1f5eff; outline-offset: 2px; }
  #box { border-radius: 14px; padding: 18px; min-height: 0; }
  #box.ok { background: rgba(223,245,227,0.85); border: 2px solid #2e9a4d; }
  #box.no { background: rgba(236,236,240,0.85); border: 2px solid #9aa1b2; }
  #box.ng { background: rgba(253,228,228,0.85); border: 2px solid #d64545; }
  #box .big { font-size: 30px; font-weight: 700; margin: 0 0 8px; }
  #box .txt { font-size: 18px; margin: 4px 0; word-break: break-all; }
  #msg { font-size: 14px; color: #5a6275; margin: 0; word-break: break-all; }
</style>
</head>
<body>
<main>
  <video id="video" playsinline muted hidden></video>
  <button id="scanBtn" type="button">カメラでスキャン</button>
  <input id="q" type="text" inputmode="numeric" maxlength="13" placeholder="13桁の数字" autocomplete="off"/>
  <button id="goBtn" type="button">検索</button>
  <div id="box"></div>
  <p id="msg"></p>
</main>

<script>
const EP = "__EP__";

const $ = id => document.getElementById(id);
let stream = null;
let scanning = false;

function log(c) { console.log(c); }

function show(t) {
  console.log(t);
  $("msg").textContent = t;
}

function clearMsg() { $("msg").textContent = ""; }

function stopScan() {
  scanning = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  $("video").hidden = true;
  $("scanBtn").textContent = "カメラでスキャン";
}

async function startScan() {
  clearMsg();
  if (!("BarcodeDetector" in window)) {
    show("この端末では読み取れません。数字を入力してください");
    return;
  }
  try {
    log("C01");
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    const video = $("video");
    video.srcObject = stream;
    video.hidden = false;
    await video.play();
    $("scanBtn").textContent = "スキャン停止";

    const det = new BarcodeDetector({ formats: ["ean_13"] });
    scanning = true;
    log("C02");

    const loop = async () => {
      if (!scanning) return;
      try {
        const codes = await det.detect(video);
        const hit = codes.find(c => /^\d{13}$/.test(c.rawValue));
        if (hit) {
          $("q").value = hit.rawValue;
          stopScan();
          log("C03");
          return;
        }
      } catch (e) {
        stopScan();
        show("読み取りに失敗しました (C04 " + e + ")");
        return;
      }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    stopScan();
    show("カメラを使えません (C05 " + e.name + ")");
  }
}

function line(cls, text) {
  const p = document.createElement("p");
  p.className = cls;
  p.textContent = text;
  return p;
}

async function go() {
  clearMsg();
  const q = $("q").value.trim();
  const b = $("box");
  b.className = "";
  b.replaceChildren();

  if (!/^\d{13}$/.test(q)) {
    show("13桁の数字を入力してください");
    return;
  }

  if (EP.indexOf("https://") !== 0) {
    b.className = "ng";
    b.append(line("txt", "設定エラー (S00)"));
    return;
  }

  try {
    log("S01");
    const res = await fetch(EP + "?q=" + encodeURIComponent(q));
    log("S02 " + res.status);
    const data = await res.json();
    log("S03 r=" + data.r);

    if (data.r === 1) {
      document.body.style.backgroundImage = "url('muu_ok.jpg')";
      b.className = "ok";
      b.append(line("big", "あるよ！"));
      if (data.x) b.append(line("txt", data.x));
      if (data.y) b.append(line("txt", data.y));
    } else if (data.r === 0) {
      document.body.style.backgroundImage = "url('muu_ng.jpg')";
      b.className = "no";
      b.append(line("big", "ないね。。"));
    } else {
      document.body.style.backgroundImage = "";
      b.className = "ng";
      b.append(line("txt", "エラー " + (data.m || "S08")));
    }
  } catch (e) {
    document.body.style.backgroundImage = "";
    b.className = "ng";
    b.append(line("txt", "通信に失敗しました (S09 " + e + ")"));
  }
}

$("scanBtn").addEventListener("click", () => (scanning ? stopScan() : startScan()));
$("goBtn").addEventListener("click", go);
</script>
</body>
</html>
